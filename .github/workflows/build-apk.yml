name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions web UI

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create Releases and attach direct .apk files

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17 environment
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install project dependencies
      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      # 5. Build Release APK
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 6. Rename APK to a clean, direct installable file name
      - name: Prepare Direct APK Asset
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/operon-v0.1.0.apk
          echo "Direct APK prepared at release-output/operon-v0.1.0.apk"

      # 7. Publish direct raw .apk asset to GitHub Releases (No ZIP, direct mobile install!)
      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Operon Release {0}', github.ref_name) || 'Operon Latest Build (Direct APK)' }}
          files: release-output/operon-v0.1.0.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
