name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions web UI

# Automatically cancel redundant builds if a new commit is pushed in quick succession
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create Releases and attach direct .apk files

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1.1 Version comes from pubspec.yaml only. Manual runs reuse it to
      # derive the release tag, so no other file needs a version bump.
      - name: Resolve app version
        id: app_version
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v${APP_VERSION}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version v${APP_VERSION}" >&2
            exit 1
          fi
          echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v${APP_VERSION}"

      # 2. Setup Java 17 environment with Gradle cache
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter SDK with Pub cache
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install project dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Static analysis + unit tests (fail fast before the APK build)
      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # 6. Build Release APK (Target modern arm64-v8a: 60% faster compilation, ~25MB lightweight APK)
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      # 7. Rename APK to a clean, direct installable file name
      - name: Prepare Direct APK Asset
        run: |
          mkdir -p release-output
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "release-output/operon-${TAG_NAME}.apk"
          echo "Direct APK prepared at release-output/operon-${TAG_NAME}.apk"

      # 8. Publish direct raw .apk asset to GitHub Releases (No ZIP, direct mobile install!)
      # Only tagged releases (or a manual dispatch) publish; plain main pushes just validate/build.
      - name: Publish Direct APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Operon Release {0}', github.ref_name) || format('Operon Release {0} (Direct APK)', steps.app_version.outputs.tag) }}
          files: release-output/*.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
