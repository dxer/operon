name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions web UI

# Automatically cancel redundant builds if a new commit is pushed in quick succession
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create Releases and attach direct .apk files

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17 environment with Gradle cache
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter SDK with Pub cache
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Cache Android NDK (Avoids repeated 1.2GB downloads every build)
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ${{ runner.os }}-ndk-28.2
          restore-keys: |
            ${{ runner.os }}-ndk-

      # 5. Install project dependencies (Fast incremental restore, no redundant clean)
      - name: Install Dependencies
        run: flutter pub get

      # 6. Build Release APK (Target modern arm64-v8a: 60% faster compilation, ~25MB lightweight APK)
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      # 7. Rename APK to a clean, direct installable file name
      - name: Prepare Direct APK Asset
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/operon-v0.1.0.apk
          echo "Direct APK prepared at release-output/operon-v0.1.0.apk"

      # 8. Publish direct raw .apk asset to GitHub Releases (No ZIP, direct mobile install!)
      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Operon Release {0}', github.ref_name) || 'Operon Latest Build (Direct APK)' }}
          files: release-output/operon-v0.1.0.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
