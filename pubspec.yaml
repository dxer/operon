name: operon
description: "Operon - A lightweight, autonomous AI agent browser for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # High-performance native Android WebView wrapper with rich CDP & JS features
  flutter_inappwebview: ^6.1.5
  # Local configuration persistence (API keys, Base URL, User-Agent, etc.)
  shared_preferences: ^2.3.2
  # HTTP client for OpenAI-compatible LLM endpoints
  http: ^1.2.2
  # Smooth UI loading indicators
  flutter_spinkit: ^5.2.1
  # Modern animations
  flutter_animate: ^4.5.2
  # Android system local notifications (background alerts, completion, captcha)
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/agent_dom.js
