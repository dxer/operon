name: operon
description: "Operon - A lightweight, autonomous AI agent browser for Android."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # High-performance native Android WebView wrapper with rich CDP & JS features
  flutter_inappwebview: ^6.1.5
  # Local configuration persistence (API keys, Base URL, User-Agent, etc.)
  shared_preferences: ^2.3.2
  # HTTP client for OpenAI-compatible LLM endpoints
  http: ^1.2.2
  # Smooth UI loading indicators
  flutter_spinkit: ^5.2.1
  # Modern animations
  flutter_animate: ^4.5.2
  # Android system local notifications (background alerts, completion, captcha)
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/js/agent_dom.js
    - assets/icon/app_icon.png
