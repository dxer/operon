name: operon
description: "Operon - A lightweight, autonomous AI agent browser for Android."
publish_to: "none"
version: 0.4.1+5

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # High-performance native Android WebView wrapper with rich CDP & JS features
  flutter_inappwebview: ^6.1.5
  # Local configuration persistence (API keys, Base URL, User-Agent, etc.)
  shared_preferences: ^2.3.2
  # HTTP client for OpenAI-compatible LLM endpoints
  # 1.6+ provides AbortableRequest so stopping a task aborts the in-flight call.
  http: ^1.6.0
  # Android system local notifications (background alerts, completion, captcha)
  flutter_local_notifications: ^17.2.2
  # Reads the installed APK version, so the UI never hardcodes it again.
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/js/agent_dom.js
    - assets/icon/app_icon.png
